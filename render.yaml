services:
  - type: web
    name: bexio-lieferportal
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bexio-lieferportal-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: bexio-lieferportal-db
    plan: free
