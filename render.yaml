# Entspricht den tatsächlich gebuchten Instanzen (Stand 11/2026).
# Wichtig: Nicht auf "free" zurückstellen. Eine Free-Datenbank läuft nach 30 Tagen ab
# und hat keine Backups; ein Blueprint-Sync mit "free" würde die Instanzen herabstufen.
services:
  - type: web
    name: bexio-lieferportal
    runtime: node
    plan: 0.5c-512mb        # $7/Monat, 0.5 CPU, 512 MB RAM
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bexio-lieferportal-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ENCRYPTION_KEY
        generateValue: true

databases:
  - name: bexio-lieferportal-db
    plan: 0.1c-256mb        # $6/Monat, 0.1 CPU, 256 MB RAM, inkl. Point-in-Time-Recovery (3 Tage)
